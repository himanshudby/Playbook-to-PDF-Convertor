<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playbook to PDF Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar for preview area */
      .preview-scroll::-webkit-scrollbar {
        width: 8px;
      }
      .preview-scroll::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      .preview-scroll::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      .preview-scroll::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* PDF Generation Styles */
      /* These classes target the raw HTML injected by Gemini */
      .playbook-page {
        padding: 40px;
        background-color: white;
        box-sizing: border-box;
        page-break-inside: avoid; /* Prevent breaking content within a playbook */
        break-inside: avoid; /* Modern CSS property */
        min-height: 0; /* Allow natural height */
      }

      /* Only add page break if there's content before (prevents blank pages) */
      .playbook-page + .playbook-page {
        /* Let html2pdf handle page breaks naturally based on content overflow */
        margin-top: 0;
      }
      
      /* For PDF generation, use a smarter page break approach */
      @media print {
        .playbook-page:not(:first-child) {
          page-break-before: auto; /* Let it break naturally */
        }
      }

      /* Compact table styles for generated content */
      #document-preview-content table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.875rem;
        margin-top: 0.5rem;
        margin-bottom: 0.5rem;
      }
      #document-preview-content th {
        background-color: #f8fafc;
        border-bottom: 2px solid #e2e8f0;
        text-align: left;
        padding: 0.5rem;
        font-weight: 600;
        color: #475569;
      }
      #document-preview-content td {
        border-bottom: 1px solid #e2e8f0;
        padding: 0.5rem;
        color: #334155;
      }
      #document-preview-content ul, #document-preview-content ol {
        padding-left: 1.5rem;
        margin-bottom: 1rem;
      }
      #document-preview-content li {
        margin-bottom: 0.25rem;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
